<!DOCTYPE html>
<html lang="en">
<head data-sly-use.childContent="jcr:content">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${childContent.jcr:title @ context='text'}</title>
    <sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
         data-sly-call="${clientlib.css @ categories='component-library.site'}"></sly>
</head>
<body>
    <sly data-sly-resource="${'jcr:content/header' @ resourceType='component-library/components/header'}"/>

    <main>
        <sly data-sly-resource="${'jcr:content/hero-banner' @ resourceType='component-library/components/hero-banner'}"/>

        <section class="about-section" id="about">
            <sly data-sly-resource="${'jcr:content/about-title' @ resourceType='component-library/components/section-title'}"/>
            <sly data-sly-resource="${'jcr:content/about-banner' @ resourceType='component-library/components/hero-banner'}"/>
        </section>

        <section class="projects-section" id="projects">
            <sly data-sly-resource="${'jcr:content/projects-title' @ resourceType='component-library/components/section-title'}"/>
            <sly data-sly-resource="${'jcr:content/project1' @ resourceType='component-library/components/project-card'}"/>
            <sly data-sly-resource="${'jcr:content/project2' @ resourceType='component-library/components/project-card'}"/>
            <sly data-sly-resource="${'jcr:content/project3' @ resourceType='component-library/components/project-card'}"/>
        </section>

        <section class="contact-section" id="contact">
            <sly data-sly-resource="${'jcr:content/contact-title' @ resourceType='component-library/components/section-title'}"/>
            <sly data-sly-resource="${'jcr:content/contact-form' @ resourceType='component-library/components/contact-form'}"/>
        </section>
    </main>

    <sly data-sly-resource="${'jcr:content/footer' @ resourceType='component-library/components/footer'}"/>

    <sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
         data-sly-call="${clientlib.js @ categories='component-library.site'}"></sly>
</body>
</html>
